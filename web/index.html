<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mail Manager</title>
<link rel="stylesheet" href="style.css">
<script src="vue.global.prod.js"></script>
<script src="i18n.js"></script>
<script src="countries.js"></script>
<script src="importer.js"></script>
<script src="agent.js"></script>
</head>
<body>
<div id="app" v-cloak>
  <!-- ========== 鎖屏 ========== -->
  <div v-if="ready && !lock.unlocked" class="lock-screen">
    <form class="lock-card" @submit.prevent="submitLock">
      <div class="lock-icon">🔒</div>
      <h2>{{ lock.has_password ? t('lock.unlockTitle') : t('lock.setupTitle') }}</h2>
      <p v-if="!lock.has_password" class="muted">{{ t('lock.setupDesc') }}<br><b class="danger-text">{{ t('lock.setupWarn') }}</b></p>
      <input ref="lockInput" type="password" v-model="lockForm.pw" :placeholder="lock.has_password ? t('lock.password') : t('lock.newPassword')" autofocus>
      <input v-if="!lock.has_password" type="password" v-model="lockForm.pw2" :placeholder="t('lock.confirm')">
      <div class="lock-err">{{ lockForm.err }}</div>
      <button class="btn primary block" :disabled="lockForm.busy">{{ lockForm.busy ? t('lock.wait') : (lock.has_password ? t('lock.unlock') : t('lock.setupBtn')) }}</button>
      <div class="lock-foot muted">
        <select v-model="prefs.lang"><option v-for="l in languages" :value="l.code">{{ l.label }}</option></select>
        <select v-model="prefs.theme">
          <option value="light">{{ t('theme.light') }}</option><option value="dark">{{ t('theme.dark') }}</option><option value="system">{{ t('theme.system') }}</option>
        </select>
        <span :title="meta.db_path">{{ dbName }}</span>
      </div>
    </form>
  </div>

  <template v-if="lock.unlocked">
  <!-- ========== 側邊欄 ========== -->
  <aside class="sidebar">
    <div class="brand">
      <span>{{ selfmail ? '📬' : '📧' }} {{ appTitle }}</span>
      <button class="icon-btn" :title="t('settings.theme')" @click="toggleTheme">{{ isDark ? '☀' : '☾' }}</button>
    </div>

    <div v-if="!selfmail" class="side-title">
      <span>{{ t('side.sheets') }}</span>
      <button class="icon-btn" :title="t('sheet.add')" @click="addSheet">＋</button>
    </div>
    <ul v-if="!selfmail" class="side-list">
      <li v-for="s in visibleSheets" :key="s.id" :class="{active: s.id === sheetId, 'drag-over': sideOver === 'sheets' + s.id}" @click="selectSheet(s.id)"
          @dblclick="renameSheet(s)" :title="t('sheet.dblclick')" draggable="true"
          @dragstart="onSideDragStart('sheets', s.id, $event)" @dragover="onSideDragOver('sheets', s.id, $event)"
          @drop.prevent="onSideDrop('sheets', s.id)" @dragend="onSideDragEnd">
        <span class="name">{{ sheetName(s) }}</span>
        <span class="count">{{ s.count }}</span>
        <span class="row-tools">
          <button class="icon-btn sm" :title="t('sheet.rename')" @click.stop="renameSheet(s)">✎</button>
          <button class="icon-btn sm" :title="t('sheet.delete')" @click.stop="deleteSheet(s)">✕</button>
        </span>
      </li>
    </ul>

    <div class="side-title">
      <span>{{ t('side.groups') }}</span>
      <button class="icon-btn" :title="t('group.manage')" @click="openGroups">⚙</button>
    </div>
    <ul class="side-list">
      <li :class="{active: filters.group === ''}" @click="filters.group = ''">
        <span class="dot" style="background:#9aa4b2"></span><span class="name">{{ t('group.all') }}</span>
        <span class="count">{{ accounts.length }}</span>
      </li>
      <li v-for="g in groups" :key="g.id" :class="{active: filters.group === g.id, 'drag-over': sideOver === 'groups' + g.id}" @click="filters.group = g.id"
          :title="t('group.dragTip')" draggable="true"
          @dragstart="onSideDragStart('groups', g.id, $event)" @dragover="onSideDragOver('groups', g.id, $event)"
          @drop.prevent="onSideDrop('groups', g.id)" @dragend="onSideDragEnd">
        <span class="dot" :style="{background: g.color}"></span><span class="name">{{ g.name }}</span>
        <span class="count">{{ groupCounts[g.id] || 0 }}</span>
      </li>
      <li :class="{active: filters.group === 'none'}" @click="filters.group = 'none'">
        <span class="dot hollow"></span><span class="name">{{ t('group.none') }}</span>
        <span class="count">{{ groupCounts.none || 0 }}</span>
      </li>
    </ul>

    <button v-if="!selfmail" class="side-btn side-wide" @click="openSelfmailWindow" :title="t('selfmail.openTip')">📬 {{ t('selfmail.title') }}</button>
    <div class="side-actions">
      <button class="side-btn" @click="lockNow" :title="t('lock.lockTip')">🔒 {{ t('lock.lock') }}</button>
      <button class="side-btn" @click="openSettings">⚙ {{ t('settings.title') }}</button>
    </div>
    <div class="side-foot" :title="meta.db_path">{{ t('side.dataFile') }}：{{ dbName }}</div>
  </aside>

  <!-- ========== 主區域 ========== -->
  <main class="main">
    <header class="toolbar">
      <div class="search">
        <span class="search-icon">⌕</span>
        <input ref="searchInput" v-model="search" :placeholder="t('search.placeholder')">
        <button v-if="search" class="icon-btn sm" @click="search = ''">✕</button>
      </div>
      <template v-if="selfmail">
        <button class="btn primary" @click="openSelfmailCreate">{{ t('selfmail.create') }}</button>
        <button class="btn" :disabled="smSyncing" @click="selfmailSync(false)" :title="t('selfmail.syncTip')">{{ smSyncing ? t('selfmail.syncing') : '⟳ ' + t('selfmail.sync') }}</button>
      </template>
      <template v-else>
        <button class="btn primary" @click="openEdit()">{{ t('btn.add') }}</button>
        <button class="btn" @click="openImport">{{ t('btn.import') }}</button>
      </template>
      <div class="dropdown" @mouseleave="exportMenu = false">
        <button class="btn" @click="exportMenu = !exportMenu">{{ t('btn.export') }} ▾</button>
        <div v-if="exportMenu" class="menu">
          <div class="menu-item" @click="doExport('csv')">{{ t('export.csv', {scope: exportScope}) }}</div>
          <div class="menu-item" @click="doExport('txt')">{{ t('export.txt', {scope: exportScope}) }}</div>
        </div>
      </div>
      <button class="btn" @click="openColumns">{{ t('btn.columns') }}</button>
      <button class="btn" :class="{primary: agent.open}" @click="toggleAgent">🤖 {{ t('agent.title') }}</button>
    </header>

    <div v-if="selfmail && mailCfg && !mailCfg.panel_url" class="inbox-error">{{ t('selfmail.notConfigured') }}</div>
    <div class="filters">
      <select v-model="filters.status">
        <option value="">{{ t('filter.allStatus') }}</option>
        <option v-for="s in meta.statuses" :value="s">{{ statusLabel(s) }}（{{ statusCounts[s] || 0 }}）</option>
      </select>
      <select v-model="filters.domain">
        <option value="">{{ t('filter.allDomains') }}</option>
        <option v-for="d in domains" :value="d.name">{{ d.name }}（{{ d.count }}）</option>
      </select>
      <select v-model="filters.twofa">
        <option value="">{{ t('filter.twofaAny') }}</option>
        <option value="yes">{{ t('filter.twofaYes') }}</option>
        <option value="no">{{ t('filter.twofaNo') }}</option>
      </select>
      <select v-model="filters.recovery">
        <option value="">{{ t('filter.recAny') }}</option>
        <option value="yes">{{ t('filter.recYes') }}</option>
        <option value="no">{{ t('filter.recNo') }}</option>
      </select>
      <div v-if="countryColumns.length" class="country-filter" :class="{active: filters.country.trim()}">
        <span class="muted">🌐</span>
        <input v-model="filters.country" :placeholder="t('filter.country')" :title="t('filter.countryTip')">
        <span v-if="filters.country.trim() && !countryFilterCodes.length" class="muted">{{ t('filter.countryNoMatch') }}</span>
        <span v-for="code in countryFilterCodes" :key="code" class="chip" :title="countryName(code)">{{ flag(code) }} {{ code }}</span>
        <button v-if="filters.country" class="icon-btn sm" @click="filters.country = ''">✕</button>
      </div>
      <label class="check"><input type="checkbox" v-model="showPwd"> {{ t('filter.showPwd') }}</label>
      <button v-if="hasFilter" class="link" @click="resetFilters">{{ t('filter.clear') }}</button>
      <span class="spacer"></span>
      <span class="totp-timer" :class="{warn: remaining <= 5}" :title="t('filter.timerTip')">
        <svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="15" class="bg"/><circle cx="18" cy="18" r="15" class="fg"
          :style="{strokeDashoffset: 94.25 * (1 - remaining / 30)}"/></svg>{{ remaining }}s
      </span>
    </div>

    <div v-if="selectedIds.length" class="bulkbar">
      <span v-html="t('bulk.selected', {n: '<b>' + selectedIds.length + '</b>'})"></span>
      <select @change="bulkGroup($event)">
        <option value="">{{ t('bulk.setGroup') }}</option>
        <option v-for="g in groups" :value="g.id">{{ g.name }}</option>
        <option value="none">{{ t('bulk.ungroup') }}</option>
      </select>
      <select @change="bulkStatus($event)">
        <option value="">{{ t('bulk.setStatus') }}</option>
        <option v-for="s in meta.statuses" :value="s">{{ statusLabel(s) }}</option>
      </select>
      <select v-if="visibleSheets.length > 1" @change="bulkMove($event)">
        <option value="">{{ t('bulk.move') }}</option>
        <option v-for="s in visibleSheets" v-show="s.id !== sheetId" :value="s.id">{{ sheetName(s) }}</option>
      </select>
      <select v-if="currentSheet.columns.length" @change="openBulkColumn($event)">
        <option value="">{{ t('bulk.setColumn') }}</option>
        <option v-for="c in currentSheet.columns" :value="c.id">{{ c.name }}</option>
      </select>
      <select v-if="selfDomains.length" @change="bulkCreateRecovery($event)" :title="t('selfmail.bulkTip')">
        <option value="">{{ t('selfmail.bulk') }}</option>
        <option v-for="d in selfDomains" :key="d" :value="d">@{{ d }}</option>
      </select>
      <button class="btn sm" @click="copySelected">{{ t('bulk.copy') }}</button>
      <button class="btn sm danger" @click="bulkDelete">{{ t('btn.delete') }}</button>
      <button class="link" @click="selected = {}">{{ t('bulk.unselect') }}</button>
    </div>

    <div class="table-wrap" ref="tableWrap" @scroll="onTableScroll">
      <table class="grid main-grid" :style="tableStyle">
        <colgroup>
          <col style="width:34px">
          <col v-for="c in visibleColumns" :key="c.key" :style="{width: colWidth(c) + 'px'}">
          <col>
        </colgroup>
        <thead>
          <tr>
            <th class="col-check"><input type="checkbox" :checked="allPageSelected" @change="togglePage($event)"></th>
            <th v-for="c in visibleColumns" :key="c.key" :class="['col-' + c.key, {sortable: c.sort, dragging: dragCol === c.key, 'drag-over': dragOver === c.key}]"
                draggable="true" :title="c.label + ' · ' + t('columns.dragTip')" @click="onHeaderClick(c)"
                @dragstart="onColDragStart(c, $event)" @dragover="onColDragOver(c, $event)" @dragleave="dragOver === c.key && (dragOver = '')"
                @drop.prevent="onColDrop(c)" @dragend="onColDragEnd">
              <span class="th-label">{{ c.label }}</span><span v-if="sort.key === c.key" class="sort">{{ sort.dir > 0 ? '▲' : '▼' }}</span>
              <span class="col-resizer" draggable="false" @mousedown.stop.prevent="startResize(c, $event)" @click.stop @dblclick.stop="resetWidth(c)"></span>
            </th>
            <th class="col-actions">{{ t('col.actions') }}</th>
          </tr>
        </thead>
        <tbody>
          <tr v-for="(a, ri) in paged" :key="a.id" :class="{selected: selected[a.id]}" @dblclick="openEdit(a, cellField($event))">
            <td class="col-check"><input type="checkbox" v-model="selected[a.id]"></td>
            <td v-for="c in visibleColumns" :key="c.key" :class="['col-' + c.key, c.custom && 'type-' + c.col.type]">
              <template v-if="c.key === 'index'">
                <span class="muted row-index">{{ (page - 1) * pageSize + ri + 1 }}</span>
              </template>
              <template v-else-if="c.key === 'email'">
                <span class="copy mono" :title="a.email" @click="copy(a.email, t('copy.email'))">{{ a.email }}</span>
                <button v-if="mailEligible(a, 'email')" class="icon-btn sm inbox-btn" :title="t('mail.open')" @click="openInbox(a, 'email')">📥</button>
              </template>
              <template v-else-if="c.key === 'password' || c.key === 'recovery_password'">
                <span v-if="a[c.key]" class="copy mono" @click="copy(a[c.key], t('copy.password'), true)">{{ showPwd || revealed[a.id] ? a[c.key] : '••••••••' }}</span>
                <button v-if="a[c.key] && !showPwd" class="icon-btn sm eye" @click="revealed[a.id] = !revealed[a.id]">{{ revealed[a.id] ? '◉' : '◎' }}</button>
              </template>
              <template v-else-if="c.key === 'totp'">
                <span v-if="a.totp_secret" class="code copy" :class="{warn: remaining <= 5}" @click="copy(codes[a.totp_secret], t('copy.code'))"
                      :title="t('row.secret', {s: a.totp_secret})">{{ fmtCode(codes[a.totp_secret]) }}</span>
                <span v-else class="muted">—</span>
              </template>
              <template v-else-if="c.key === 'recovery_email' || c.key === 'phone'">
                <span v-if="a[c.key]" class="copy mono" :title="a[c.key]" @click="copy(a[c.key])">{{ a[c.key] }}</span>
                <button v-if="c.key === 'recovery_email' && mailEligible(a, 'recovery')" class="icon-btn sm inbox-btn"
                        :title="t('mail.open')" @click="openInbox(a, 'recovery')">📥</button>
              </template>
              <template v-else-if="c.key === 'group'">
                <span v-if="groupMap[a.group_id]" class="tag" :style="tagStyle(groupMap[a.group_id].color)">{{ groupMap[a.group_id].name }}</span>
              </template>
              <template v-else-if="c.key === 'status'">
                <span class="status" :class="'st-' + statusIndex(a.status)">{{ statusLabel(a.status) }}</span>
              </template>
              <template v-else-if="c.key === 'notes'">
                <span class="notes" :title="a.notes" @click="openEdit(a, 'notes')">{{ a.notes || '' }}<span v-if="!a.notes" class="muted add-note">{{ t('row.addNote') }}</span></span>
              </template>
              <template v-else-if="c.key === 'updated'">
                <span class="muted">{{ fmtDate(a.updated_at) }}</span>
              </template>
              <template v-else-if="c.custom">
                <cell-view :col="c.col" :value="a.extra[c.col.id]" @click="onCustomCell(a, c.col, $event)"></cell-view>
              </template>
            </td>
            <td class="col-actions">
              <button class="icon-btn sm" :title="t('row.copyRow')" @click="copyRow(a)">⧉</button>
              <button class="icon-btn sm" :title="t('row.edit')" @click="openEdit(a)">✎</button>
              <button class="icon-btn sm" :title="t('row.delete')" @click="deleteOne(a)">✕</button>
            </td>
          </tr>
        </tbody>
      </table>
      <div v-if="!filtered.length" class="empty">{{ accounts.length ? t('empty.filtered') : (selfmail ? t('selfmail.empty') : t('empty.sheet')) }}</div>
    </div>

    <footer class="pager">
      <span class="info">{{ pageInfo }}</span>
      <button class="page-btn" :disabled="page <= 1" @click="page--">‹ {{ t('pager.prev') }}</button>
      <template v-for="p in pageButtons">
        <span v-if="p === '…'" class="muted">…</span>
        <button v-else class="page-btn" :class="{active: p === page}" @click="page = p">{{ p }}</button>
      </template>
      <button class="page-btn" :disabled="page >= pageCount" @click="page++">{{ t('pager.next') }} ›</button>
      <select v-model.number="pageSize">
        <option v-for="n in [20, 50, 100, 200]" :value="n">{{ t('pager.perPage', {n}) }}</option>
      </select>
      <span class="muted">{{ t('pager.goto') }}</span>
      <input class="goto" type="number" min="1" :max="pageCount" :value="page" @change="gotoPage($event)">
    </footer>
  </main>

  <!-- ========== AI 助手 ========== -->
  <aside v-if="agent.open" class="agent-panel" @dragover.prevent @drop.prevent="agentDrop($event)">
    <div class="agent-head">
      <button class="icon-btn" :class="{on: agent.showList}" :title="t('agent.chats')" @click="agentRefreshChats(); agent.showList = !agent.showList">☰</button>
      <b class="ellipsis agent-title" :title="agent.title" @click="agentRefreshChats(); agent.showList = !agent.showList">🤖 {{ agent.title || t('agent.title') }}</b>
      <span class="spacer"></span>
      <button class="icon-btn" :title="t('kb.title')" @click="openKb()">🧠</button>
      <button class="icon-btn" :title="t('agent.newChat')" @click="agentNewChat">＋</button>
      <button class="icon-btn" :title="t('agent.transcript')" :disabled="!agent.items.length" @click="agentTranscript">📋</button>
      <button class="icon-btn" @click="toggleAgent">✕</button>
    </div>
    <div v-if="agent.showList" class="agent-chats">
      <div class="agent-chats-head">
        <span class="muted">{{ t('agent.chatsN', {n: agent.chats.length, max: 99}) }}</span>
        <span class="spacer"></span>
        <button class="btn sm primary" @click="agentNewChat">＋ {{ t('agent.newChat') }}</button>
      </div>
      <div v-for="c in agent.chats" :key="c.id" class="agent-chat" :class="{active: c.id === agent.chatId}" @click="agentOpenChat(c.id)">
        <span class="ellipsis">{{ c.title || t('agent.untitled') }}</span>
        <span class="muted agent-chat-time">{{ agentTime(c.updated_at) }}</span>
        <button class="icon-btn sm" :title="t('btn.rename')" @click.stop="agentRenameChat(c)">✎</button>
        <button class="icon-btn sm" :title="t('btn.delete')" @click.stop="agentDeleteChat(c)">✕</button>
      </div>
      <div v-if="!agent.chats.length" class="muted agent-chat-empty">{{ t('agent.noChats') }}</div>
    </div>
    <div class="agent-opts">
      <label class="check" :title="t('agent.autoTip')"><input type="checkbox" v-model="prefs.agentAuto"> {{ t('agent.auto') }}</label>
      <label class="check" :title="t('agent.secretsTip')"><input type="checkbox" v-model="prefs.agentSecrets"> {{ t('agent.secrets') }}</label>
    </div>
    <div class="agent-msgs" ref="agentMsgs">
      <div v-if="!agent.items.length" class="agent-empty">
        <p class="muted">{{ t('agent.hello') }}</p>
        <button v-for="ex in agentExamples" :key="ex" class="agent-example" @click="agentSend(ex)">{{ ex }}</button>
        <p class="muted agent-privacy">{{ t('agent.privacy') }}</p>
      </div>
      <div v-for="(m, i) in agent.items" :key="i" class="agent-msg" :class="m.role">
        <div v-if="m.images && m.images.length" class="agent-imgs">
          <img v-for="(src, k) in m.images" :key="k" :src="src" alt="" @click="agent.viewer = src">
        </div>
        <div v-if="m.text" class="bubble-wrap">
          <div v-if="m.role === 'user'" class="bubble">{{ m.text }}</div>
          <div v-else class="bubble" v-html="agentMd(m.text)"></div>
          <button class="icon-btn sm bubble-copy" :title="t('agent.copyMsg')" @click="agentCopyText(m.text)">⧉</button>
        </div>
        <div v-for="(tc, j) in m.tools" :key="j" class="agent-tool" :class="[tc.status, {danger: tc.danger}]">
          <div class="agent-tool-row" :title="t('agent.details')" @click="tc.open = !tc.open">
            <span v-if="tc.status === 'running'" class="spinner"></span>
            <span v-else>{{ tc.status === 'error' ? '⚠' : tc.status === 'confirm' ? '❓' : '✓' }}</span>
            <span>{{ agentToolLabel(tc.name) }}</span>
            <span class="muted ellipsis" :title="tc.summary">{{ tc.summary }}</span>
            <span class="spacer"></span>
            <span v-if="tc.status === 'running'" class="muted agent-secs">{{ agentSecs(tc.started) }}s</span>
            <span v-else-if="tc.elapsed >= 2" class="muted agent-secs">{{ tc.elapsed }}s</span>
            <button v-if="tc.undoId && !agent.busy" class="link" @click.stop="agentUndoClick(tc)">↶ {{ t('agent.undo') }}</button>
            <span v-else-if="tc.undone" class="muted">{{ t('agent.undone') }}</span>
          </div>
          <div v-if="tc.status === 'running' && tc.progress && tc.progress.total" class="agent-progress">
            <div class="bar"><div :style="{width: (100 * tc.progress.done / tc.progress.total) + '%'}"></div></div>
            <span class="muted ellipsis">{{ tc.progress.done }}/{{ tc.progress.total }} · {{ tc.progress.current }}</span>
          </div>
          <div v-if="tc.open" class="agent-detail">
            <div class="muted">{{ t('agent.args') }}</div><pre>{{ agentPretty(tc.args) }}</pre>
            <template v-if="tc.result"><div class="muted">{{ t('agent.result') }}</div><pre>{{ agentPretty(tc.result) }}</pre></template>
          </div>
          <div v-if="tc.status === 'confirm'" class="agent-confirm">
            <div class="agent-desc">{{ tc.desc }}</div>
            <div class="editor-row">
              <button class="btn sm" :class="tc.danger ? 'danger' : 'primary'" @click="tc.resolve(true)">{{ tc.danger ? t('btn.delete') : t('agent.run') }}</button>
              <button class="btn sm" @click="tc.resolve(false)">{{ t('btn.cancel') }}</button>
            </div>
          </div>
        </div>
        <div v-if="m.error" class="inbox-error">{{ m.error }}</div>
        <div v-if="m.streaming && !m.text && !m.tools.length" class="agent-thinking muted">
          <span class="spinner"></span>
          <span>{{ m.tool ? t('agent.st.preparing', {s: agentToolLabel(m.tool), n: m.toolChars}) : t('agent.st.thinking') }}</span>
          <span class="agent-secs">{{ agentSecs(m.started) }}s</span>
        </div>
      </div>
    </div>
    <div v-if="agent.busy" class="agent-statusbar"><span class="spinner"></span><span class="ellipsis">{{ agentStatusText() }}</span></div>
    <div v-if="agent.images.length" class="agent-attach">
      <div v-for="(src, k) in agent.images" :key="k" class="agent-attach-item">
        <img :src="src" alt="" @click="agent.viewer = src">
        <button class="icon-btn sm" @click="agent.images.splice(k, 1)">✕</button>
      </div>
    </div>
    <div class="agent-input">
      <div class="agent-tools-col">

        </div>
        <div class="muted ellipsis">{{ latestCode.msg.subject }}</div>
      </div>
      <div v-else-if="inbox.messages.length && !inbox.loading" class="muted" style="margin:8px 0">{{ t('mail.noCode') }}</div>

      <div class="mail-list">
        <div v-for="m in inbox.messages" :key="m.id" class="mail-item" :class="{open: inbox.open[m.id], fresh: inbox.fresh[m.id]}">
          <div class="mail-row" @click="inbox.open[m.id] = !inbox.open[m.id]">
            <span class="mail-time muted" :title="fmtDate(m.date)">{{ timeAgo(m.date) }}</span>

            <span class="mail-subject ellipsis">
              <span v-if="m.folder !== 'INBOX'" class="tag junk">{{ t('mail.junk') }}</span>{{ m.subject }}
            </span>
            <span v-for="code in m.codes" class="chip code-chip copy" @click.stop="copy(code, t('copy.code'))">{{ code }}</span>
          </div>
          <div v-if="inbox.open[m.id]" class="mail-body">
            <div class="editor-row" style="margin-bottom:6px">
              <span class="muted ellipsis">{{ m.from_addr }} · {{ fmtDate(m.date) }}</span>
              <span class="spacer"></span>
              <button v-if="m.html" class="btn sm" @click="inbox.html[m.id] = !inbox.html[m.id]">{{ inbox.html[m.id] ? t('mail.showText') : t('mail.showHtml') }}</button>
            </div>
            <iframe v-if="inbox.html[m.id]" class="mail-html" sandbox="" :srcdoc="safeHtml(m.html)"></iframe>
            <pre v-else class="mail-text">{{ m.text }}</pre>
            <div v-if="m.truncated" class="muted mail-hint">{{ t('mail.truncated') }}</div>
          </div>
        </div>
        <div v-if="!inbox.messages.length && !inbox.loading && !inbox.error" class="empty">{{ t('mail.empty') }}</div>
      </div>
      <div v-if="inbox.total > inbox.messages.length" class="mail-more">

        <button class="btn sm" :disabled="inbox.loading" @click="loadMoreMail(false)">{{ t('mail.loadMore') }}</button>
        <button class="btn sm" :disabled="inbox.loading" @click="loadMoreMail(true)">{{ t('mail.loadAll') }}</button>

              <button class="link" @click="setAllAi(false)">{{ t('import.aiNone') }}</button>
            </template>
            <button class="link" @click="imp.ai.showRaw = !imp.ai.showRaw">{{ imp.ai.showRaw ? t('import.aiHideRaw') : t('import.aiShowRaw') }}</button>

            <select v-model="smCreate.domain">
              <option v-for="d in selfDomains" :key="d" :value="d">@{{ d }}</option>
            </select>
          </label>
          <label>{{ t('col.group') }}
            <select v-model="smCreate.group_id"><option :value="null">{{ t('group.none') }}</option><option v-for="g in groups" :value="g.id">{{ g.name }}</option></select>
          </label>
          <div class="full editor-row">
            <label class="check"><input type="radio" value="names" v-model="smCreate.mode"> {{ t('selfmail.byNames') }}</label>
            <label class="check"><input type="radio" value="random" v-model="smCreate.mode"> {{ t('selfmail.byRandom') }}</label>
          </div>
          <label v-if="smCreate.mode === 'names'" class="full">{{ t('selfmail.names') }}
            <textarea v-model="smCreate.names" rows="7" class="mono" :placeholder="t('selfmail.namesPh')"></textarea>
          </label>
          <template v-else>
            <label>{{ t('selfmail.count') }}<input v-model.number="smCreate.count" type="number" min="1" max="500"></label>
            <label>{{ t('selfmail.prefix') }}<input v-model="smCreate.prefix" class="mono" placeholder="user"></label>
            <div class="full muted mail-hint">{{ t('selfmail.randomHint', {p: smCreate.prefix || ''}) }}</div>
          </template>
          <div class="full editor-row">
            <span class="muted">{{ t('col.password') }}：</span>
            <label class="check"><input type="radio" value="random" v-model="smCreate.pwMode"> {{ t('selfmail.pwRandom') }}</label>
            <label class="check"><input type="radio" value="fixed" v-model="smCreate.pwMode"> {{ t('selfmail.pwFixed') }}</label>
            <input v-if="smCreate.pwMode === 'fixed'" v-model="smCreate.password" class="mono" :placeholder="t('selfmail.pwMin')">
          </div>
        </div>
        <div v-if="smCreate.busy && smCreate.progress && smCreate.progress.total" class="agent-progress sm-progress">
          <div class="bar"><div :style="{width: (100 * smCreate.progress.done / smCreate.progress.total) + '%'}"></div></div>
          <span class="muted ellipsis">{{ smCreate.progress.done }}/{{ smCreate.progress.total }} · {{ smCreate.progress.current }}</span>
        </div>
        <div class="modal-foot">
          <span class="muted">{{ t('selfmail.createHint') }}</span>
          <span class="spacer"></span>
          <button class="btn" :disabled="smCreate.busy" @click="smCreate = null">{{ t('btn.cancel') }}</button>
          <button class="btn primary" :disabled="smCreate.busy || !smCreate.domain && smCreate.mode === 'random' || !smCreateCount()" @click="doSelfmailCreate">
            {{ smCreate.busy ? (smCreate.progress ? t('selfmail.creatingN', {d: smCreate.progress.done, n: smCreate.progress.total}) : t('selfmail.creating')) : t('selfmail.createN', {n: smCreateCount()}) }}
          </button>
        </div>
      </template>
      <template v-else>
        <div class="muted">{{ t('selfmail.created2', {n: smCreate.result.created.length, f: smCreate.result.failed.length}) }}</div>
        <div class="mini-wrap" v-if="smCreate.result.created.length">
          <table class="grid mini">
            <tr><th>{{ t('col.email') }}</th><th>{{ t('col.password') }}</th></tr>
            <tr v-for="x in smCreate.result.created" :key="x.email"><td class="mono">{{ x.email }}</td><td class="mono">{{ x.password }}</td></tr>
          </table>
        </div>
        <div v-for="f in smCreate.result.failed" :key="f.email" class="danger-text mail-hint">{{ f.email }}：{{ errText(f.error) }}</div>
        <div class="modal-foot">
          <span class="spacer"></span>
          <button v-if="smCreate.result.created.length" class="btn" @click="copySelfmailResult">{{ t('selfmail.copyAll') }}</button>
          <button class="btn primary" @click="smCreate = null">{{ t('btn.ok') }}</button>
        </div>
      </template>
    </div>
  </div>

  <!-- ========== 分組管理 ========== -->
  <div v-if="groupEdit" class="modal-mask" @mousedown.self="groupEdit = null">
    <div class="modal">
      <h3>{{ t('group.manage') }}</h3>
      <div v-for="(g, i) in groupEdit" :key="g.id || g.tmp" class="group-row">
        <input type="color" v-model="g.color">
        <input v-model="g.name" :placeholder="t('group.name')">
        <button class="icon-btn" :title="t('columns.up')" :disabled="i === 0" @click="moveGroupEdit(i, -1)">↑</button>
        <button class="icon-btn" :title="t('columns.down')" :disabled="i === groupEdit.length - 1" @click="moveGroupEdit(i, 1)">↓</button>
        <button class="icon-btn" :title="t('group.delete')" @click="removeGroup(g)">✕</button>
      </div>
      <button class="btn sm" @click="groupEdit.push({tmp: Date.now(), name: '', color: randomColor()})">{{ t('group.add') }}</button>
      <div class="modal-foot">
        <span class="muted">{{ t('group.hint') }}</span><span class="spacer"></span>
        <button class="btn" @click="groupEdit = null">{{ t('btn.cancel') }}</button>
        <button class="btn primary" @click="saveGroups">{{ t('btn.save') }}</button>
      </div>
    </div>
  </div>

  <!-- ========== 列設置 ========== -->
  <div v-if="colEdit" class="modal-mask" @mousedown.self="colEdit = null">
    <div class="modal">
      <h3>{{ t('columns.title') }}</h3>
      <div class="muted">{{ t('columns.orderHint') }}</div>
      <div class="col-list">
        <div v-for="(c, i) in colEdit.items" :key="c.key" class="group-row col-item" :class="{hidden: !c.visible}">
          <input type="checkbox" v-model="c.visible" :disabled="c.key === 'email'" :title="t('columns.show')">
          <template v-if="c.col">
            <input v-model="c.col.name" :placeholder="t('columns.namePlaceholder')">
            <select v-model="c.col.type" :title="t('columns.type')">
              <option v-for="ty in columnTypes" :value="ty">{{ t('type.' + ty) }}</option>
            </select>
          </template>
          <span v-else class="col-name">{{ c.label }}</span>
          <button class="icon-btn" :title="t('columns.up')" :disabled="i === 0" @click="moveColumn(i, -1)">↑</button>
          <button class="icon-btn" :title="t('columns.down')" :disabled="i === colEdit.items.length - 1" @click="moveColumn(i, 1)">↓</button>
          <button v-if="c.col" class="icon-btn" :title="t('btn.delete')" @click="colEdit.items.splice(i, 1)">✕</button>
          <span v-else class="icon-btn"></span>
        </div>
      </div>
      <div class="editor-row">
        <button class="btn sm" @click="addCustomColumn">{{ t('columns.add') }}</button>
        <span class="spacer"></span>
        <button class="btn sm" @click="resetColumnOrder">{{ t('columns.resetOrder') }}</button>
        <button class="btn sm" @click="resetWidths">{{ t('columns.resetWidth') }}</button>
      </div>
      <div class="modal-foot">
        <span class="muted">{{ t('columns.customHint', {name: sheetName(currentSheet)}) }}</span>
        <span class="spacer"></span>
        <button class="btn" @click="colEdit = null">{{ t('btn.cancel') }}</button>
        <button class="btn primary" @click="saveColumns">{{ t('btn.save') }}</button>
      </div>
    </div>
  </div>

  <!-- ========== 設置 ========== -->
  <div v-if="settings" class="modal-mask" @mousedown.self="settings = null">
    <div class="modal">
      <h3>{{ t('settings.title') }}</h3>
      <div class="form-grid">
        <label>{{ t('settings.theme') }}
          <select v-model="prefs.theme">
            <option value="light">{{ t('theme.light') }}</option><option value="dark">{{ t('theme.dark') }}</option><option value="system">{{ t('theme.system') }}</option>
          </select>
        </label>
        <label>{{ t('settings.language') }}
          <select v-model="prefs.lang"><option v-for="l in languages" :value="l.code">{{ l.label }}</option></select>
        </label>
        <label class="full">{{ t('settings.autoLock') }}
          <select v-model.number="prefs.autoLock">
            <option :value="0">{{ t('autolock.never') }}</option>
            <option v-for="n in [5, 15, 30]" :value="n">{{ t('autolock.min', {n}) }}</option>
            <option :value="60">{{ t('autolock.hour') }}</option>
          </select>
        </label>
      </div>
      <div class="section-title">{{ t('admin.section') }}</div>
      <div v-if="settings.mail" class="form-grid">
        <div class="full muted mail-hint">{{ t('admin.hint') }}</div>
        <label class="full">{{ t('admin.url') }}<input v-model="settings.mail.panel_url" placeholder="https://mail.example.com"></label>
        <label>{{ t('admin.safePath') }}<input v-model="settings.mail.safe_path" placeholder="/xxxxxx"></label>
        <label class="check"><input type="checkbox" v-model="settings.mail.admin_verify_cert"> {{ t('mail.verify') }}</label>
        <label>{{ t('admin.user') }}<input v-model="settings.mail.admin_user"></label>
        <label>{{ t('admin.pw') }}<input type="password" v-model="settings.mail.admin_password" :placeholder="settings.mail.has_admin_password ? t('mail.masterPwSet') : ''"></label>
        <div class="full editor-row">
          <button class="btn sm" :disabled="settings.adminTesting || !settings.mail.panel_url" @click="testAdmin">{{ settings.adminTesting ? t('mail.testing') : t('admin.test') }}</button>
          <span :class="settings.adminOk ? 'ok-text' : 'danger-text'" class="mail-test-result">{{ settings.adminMsg }}</span>
        </div>
      </div>

      <div class="section-title">{{ t('ai.section') }}</div>
      <div v-if="settings.ai" class="form-grid">
        <div class="full muted mail-hint">{{ t('ai.hint') }}</div>
        <div class="full editor-row ai-presets">
          <span class="muted">{{ t('ai.preset') }}</span>
          <button v-for="p in aiPresets" :key="p.name" class="btn sm" :class="{primary: settings.ai.base_url === p.base_url}" @click="applyAiPreset(p)">{{ p.name }}</button>
        </div>
        <label class="full">{{ t('ai.url') }}<input v-model="settings.ai.base_url" class="mono" placeholder="https://api.openai.com/v1"></label>
        <label>{{ t('ai.model') }}<input v-model="settings.ai.model" class="mono" placeholder="gpt-4o-mini"></label>
        <label>{{ t('ai.key') }}<input type="password" v-model="settings.ai.api_key" class="mono" :placeholder="settings.ai.has_api_key ? t('mail.masterPwSet') : 'sk-…'"></label>
        <label class="full">
          <span class="editor-row">{{ t('ai.prompt') }}<span class="spacer"></span>
            <button class="link" @click="settings.ai.prompt = settings.ai.default_prompt">{{ t('ai.resetPrompt') }}</button></span>
          <textarea v-model="settings.ai.prompt" rows="6" class="mono ai-prompt"></textarea>
        </label>
        <div class="full editor-row">
          <button class="btn sm" :disabled="settings.aiTesting || !settings.ai.base_url" @click="testAi">{{ settings.aiTesting ? t('mail.testing') : t('ai.test') }}</button>
          <span :class="settings.aiOk ? 'ok-text' : 'danger-text'" class="mail-test-result">{{ settings.aiMsg }}</span>
        </div>
        <div class="full section-title" style="margin-top:6px">{{ t('agentcfg.section') }}</div>
        <label>{{ t('agentcfg.turns') }}<input v-model.number="settings.ai.agent_max_turns" type="number" min="1" max="200"></label>
        <label>{{ t('agentcfg.chars') }}<input v-model.number="settings.ai.agent_max_chars" type="number" min="5000" step="10000"></label>
        <div class="full muted mail-hint">{{ t('agentcfg.contextHint') }}</div>
        <label class="full check"><input type="checkbox" v-model="settings.ai.agent_learn"> {{ t('agentcfg.learn') }}</label>
        <label class="full check"><input type="checkbox" v-model="settings.ai.agent_reflect" :disabled="!settings.ai.agent_learn"> {{ t('agentcfg.reflect') }}</label>
        <div class="full"><button class="btn sm" @click="openKb()">🧠 {{ t('kb.manage') }}</button></div>
      </div>

      <div class="section-title">{{ t('settings.changePw') }}</div>
      <div class="form-grid one">
        <input type="password" v-model="settings.old" :placeholder="t('settings.oldPw')">
        <input type="password" v-model="settings.pw" :placeholder="t('settings.newPw')">
        <input type="password" v-model="settings.pw2" :placeholder="t('settings.newPw2')">
      </div>
      <div class="lock-err">{{ settings.err }}</div>
      <div class="modal-foot">
        <span class="spacer"></span>
        <button class="btn" @click="settings = null">{{ t('btn.cancel') }}</button>
        <button class="btn primary" :disabled="settings.busy" @click="saveSettings">{{ settings.busy ? t('settings.encrypting') : t('btn.save') }}</button>
      </div>
    </div>
  </div>
  </template>

  <!-- ========== 通用輸入 / 確認 ========== -->
  <div v-if="dialog" class="modal-mask" @mousedown.self="dialog.resolve(null)">
    <div class="modal small">
      <h3>{{ dialog.title }}</h3>
      <p v-if="dialog.message" class="dialog-msg">{{ dialog.message }}</p>
      <input v-if="dialog.input" v-model="dialog.value" ref="dialogInput" @keydown.enter="dialog.resolve(dialog.value)">
      <div class="modal-foot">
        <span class="spacer"></span>
        <button class="btn" @click="dialog.resolve(null)">{{ t('btn.cancel') }}</button>
        <button class="btn" :class="dialog.danger ? 'danger' : 'primary'" @click="dialog.resolve(dialog.input ? dialog.value : true)">{{ dialog.ok || t('btn.ok') }}</button>
      </div>
    </div>
  </div>

  <div class="toasts"><div v-for="toast in toasts" :key="toast.id" class="toast" :class="toast.type">{{ toast.text }}</div></div>
</div>
<script src="app.js"></script>
</body>
</html>
